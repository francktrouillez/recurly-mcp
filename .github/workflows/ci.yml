name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: tests need no write access to the repo or its token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Gate on what ships: runtime deps must have no high/critical advisories.
      # Dev-only tooling (vitest, eslint) is reported but not blocking — e.g.
      # picomatch's ReDoS advisory has no patched release and only affects
      # glob patterns we write ourselves.
      - run: npm audit --omit=dev --audit-level=high
      - name: npm audit (all deps, informational)
        if: matrix.node == 22
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run validate
