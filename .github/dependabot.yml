version: 2
# Routine version-update PRs are disabled (open-pull-requests-limit: 0).
# CVE-triggered PRs are unaffected by this limit, but ONLY when both
# "Dependabot alerts" and "Dependabot security updates" are switched on in
# Settings → Code security. The ecosystem entries are kept so the dependency
# graph is parsed and the security scanner knows what to look for.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
